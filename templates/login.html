<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - Parkinson AI</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: Arial, sans-serif;

        background:
            linear-gradient(
                135deg,
                #e8f1ff,
                #f4f8ff
            );

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;
    }


    /* =====================================================
       LOGIN CONTAINER
    ===================================================== */

    .login-container {
        width: 420px;
        max-width: 100%;
    }


    /* =====================================================
       LOGIN CARD
    ===================================================== */

    .login-card {
        background: white;

        padding: 40px;

        border-radius: 22px;

        box-shadow:
            0 10px 35px
            rgba(15, 23, 42, 0.12);

        border: 1px solid #edf2f7;
    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .logo-icon {
        width: 70px;
        height: 70px;

        margin: auto;

        border-radius: 18px;

        background: #e8f1ff;
        color: #0759d7;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 32px;
    }

    .logo-icon i {
        font-size: 32px;
    }


    /* =====================================================
       HEADING
    ===================================================== */

    h1 {
        text-align: center;

        color: #123b70;

        margin: 18px 0 8px;

        font-size: 28px;
    }

    .subtitle {
        text-align: center;

        color: #64748b;

        margin: 0 0 30px;

        font-size: 14px;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-weight: bold;

        font-size: 14px;
    }

    input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #dbe3ee;

        border-radius: 10px;

        font-size: 15px;

        outline: none;

        background: #f8fafc;

        transition: 0.2s ease;
    }

    input:focus {
        border-color: #0759d7;

        background: white;

        box-shadow:
            0 0 0 3px
            rgba(7, 89, 215, 0.1);
    }

    input::placeholder {
        color: #94a3b8;
    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-btn {
        width: 100%;

        border: none;

        padding: 14px;

        background:
            linear-gradient(
                135deg,
                #0759d7,
                #008fc9
            );

        color: white;

        border-radius: 10px;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 9px;

        transition: 0.2s ease;
    }

    .login-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 7px 18px
            rgba(7, 89, 215, 0.25);
    }

    .login-btn:active {
        transform: translateY(0);
    }


    /* =====================================================
       FLASH MESSAGE
    ===================================================== */

    .message {
        padding: 12px;

        border-radius: 9px;

        margin-bottom: 18px;

        text-align: center;

        font-size: 14px;

        line-height: 1.4;
    }

    .error {
        background: #fee2e2;

        color: #b91c1c;

        border: 1px solid #fecaca;
    }

    .success {
        background: #dcfce7;

        color: #15803d;

        border: 1px solid #bbf7d0;
    }


    /* =====================================================
       REGISTER LINK
    ===================================================== */

    .register-link {
        text-align: center;

        margin-top: 22px;

        color: #64748b;

        font-size: 14px;
    }

    .register-link a {
        color: #0759d7;

        text-decoration: none;

        font-weight: bold;

        margin-left: 4px;
    }

    .register-link a:hover {
        text-decoration: underline;
    }


    /* =====================================================
       SECURITY NOTE
    ===================================================== */

    .security-note {
        margin-top: 22px;

        padding-top: 18px;

        border-top: 1px solid #edf2f7;

        text-align: center;

        color: #94a3b8;

        font-size: 12px;
    }

    .security-note i {
        color: #0759d7;

        margin-right: 5px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 500px) {

        body {
            padding: 15px;
        }

        .login-card {
            padding: 28px 22px;
        }

        h1 {
            font-size: 24px;
        }

    }

</style>

</head>

<body>

<!-- =========================================================
     LOGIN CONTAINER
========================================================= -->

<div class="login-container">

<!-- =====================================================
     LOGIN CARD
====================================================== -->

<div class="login-card">


    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo">

        <div class="logo-icon">

            <i class="fa-solid fa-brain"></i>

        </div>

        <h1>
            Parkinson AI
        </h1>

        <p class="subtitle">
            AI-Powered Parkinson's Detection
        </p>

    </div>


    <!-- =================================================
         FLASH MESSAGES
    ================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- =================================================
         LOGIN FORM
    ================================================== -->

    <form
        action="{{ url_for('check_login') }}"
        method="POST"
    >


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>


    </form>


    <!-- =================================================
         REGISTER
    ================================================== -->

    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create an Account
        </a>

    </div>


    <!-- =================================================
         SECURITY NOTE
    ================================================== -->

    <div class="security-note">

        <i class="fa-solid fa-shield-halved"></i>

        Secure AI prediction system

    </div>


</div>

</div>

</body>

</html>
